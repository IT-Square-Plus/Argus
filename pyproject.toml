[project]
name = "Argus"
version = "1.0.1"
description = "Brave Search MCP Server with HTTP Streamable"
requires-python = ">=3.13"

dependencies = [
    "mcp>=1.8.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
